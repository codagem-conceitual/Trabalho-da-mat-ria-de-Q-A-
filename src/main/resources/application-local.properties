#
# Perfil "local": roda o ClínicaFácil sem instalar MySQL.
# Usa um banco H2 em memória (os dados somem ao desligar o sistema).
# Como rodar: mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
spring.datasource.url=jdbc:h2:mem:appointmentscheduler;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.initialization-mode=always
spring.datasource.schema=classpath:appointmentscheduler.sql
spring.datasource.sql-script-encoding=UTF-8
#
# sem envio de e-mail no ambiente local
#
mailing.enabled=false
