<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body}, '','Entrar')}"
>
<body>
<div class="row" style="margin-top: 50px" ;>
    <div class="col-lg-4 text-center"></div>
    <div class="col-lg-4 text-center">
        <h3 class="mb-3">ClínicaFácil</h3>
        <p class="text-muted">Agendamento online da clínica-escola</p>
        <div class="card">
            <div class="card-header">
                Entrar
            </div>
            <div class="card-body">
                <form id="login-form" th:action="@{/perform_login}" method='POST' class="form-horizontal">
                    <div th:if="${param.error != null}" class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>
                    <div th:if="${createdUserName != null}" class="alert alert-success">
                        <p>Usuário <span th:text="${createdUserName}"></span> cadastrado!</p>
                    </div>
                    <div th:if="${param.logout != null}" class="alert alert-success">
                        <p>Você saiu do sistema.</p>
                    </div>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input type="text" id="username" name="username" placeholder="usuário" class="form-control">
                    </div>
                    <div style="margin-bottom: 25px" class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-lock"></i></span>
                        <input type="password" id="password" name="password" placeholder="senha"
                               class="form-control">
                    </div>
                    <div style="margin-top: 10px" class="input-group">
                        <button type="submit" class="btn btn-success">Entrar</button>
                    </div>
                    <div style="margin-top: 10px" class="input-group">

                        <p>Ainda não tem cadastro?</p>
                        <p><a th:href="@{/customers/new/retail}">Cadastre-se como paciente</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-4 text-center"></div>
</div>
</body>
</html>
