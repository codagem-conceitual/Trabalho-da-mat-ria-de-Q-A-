<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'works','Especialidades')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<body>


<div class="row align-items-center justify-content-center" style="margin-top: 50px">
    <div>
        <table id="works" class="table text-center">
            <thead class="thead-dark">
            <tr>
                <th> Especialidade</th>
                                <th> Valor</th>
                <th> Duração</th>
                <th> Estagiários</th>
                <th> Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${works == null}">
                <td colspan="4"> Nenhuma especialidade cadastrada</td>
            </tr>

            <tr th:each="work : ${works}"
                th:classappend="${work.targetCustomer=='retail'} ? table-primary : table-info">
                <td><span th:text="${work.name}"> Psicologia </span></td>
                <td><span th:text="${work.price > 0 ? 'R$ ' + #numbers.formatDecimal(work.price, 1, 'POINT', 2, 'COMMA') : 'Gratuito'}"> Gratuito </span></td>
                <td><span th:text="${work.duration+' min'}"> 30 min </span></td>
                <td><span th:text="${work.providers.size()}"> 2 </span></td>
                <td><a class="btn btn-secondary" th:href="@{'/works/' + ${work.id}}" role="button">Detalhes</a>
                    <form class="d-inline-block" th:action="@{/works/delete}" method="POST">
                        <input type="hidden" name="workId" th:value="${work.id}" />
                        <button type="submit" name="submit" value="value" class="btn btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
<div class="row align-items-center justify-content-center" style="margin-top: 50px">
    <a class="btn btn-primary" th:href="@{/works/new}" role="button">Nova especialidade</a>
</div>


</body>

</html>
