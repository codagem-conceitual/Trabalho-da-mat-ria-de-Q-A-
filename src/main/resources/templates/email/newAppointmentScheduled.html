<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head></head>

<body>
<p>Olá, <span th:text="${appointment.provider.firstName}"></span>.</p>
<p>Um paciente agendou uma consulta com você. Veja os detalhes:</p>
<p>Data e hora: <span th:text="${#temporals.format(appointment.start, 'dd/MM/yyyy HH:mm')}"></span></p>
<p>Paciente: <span th:text="${appointment.customer.firstName +' '+ appointment.customer.lastName}"></span></p>
<p>Especialidade: <span th:text="${appointment.work.name}"></span></p>
<p>Duração: <span th:text="${appointment.work.duration}"></span> min</p>
<p>Valor: <span th:text="${appointment.work.price > 0 ? 'R$ ' + #numbers.formatDecimal(appointment.work.price, 1, 'POINT', 2, 'COMMA') : 'Gratuito'}"></span></p>

<p>Telefone do paciente: <span th:text="${appointment.customer.mobile}"></span></p>

<p>Equipe ClínicaFácil</p>
</body>
</html>
