<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'appointments','Confirmar consulta')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<body>
<div class="row justify-content-center">
    <div class="col-md-6 mt-3">

        <table class="table">
            <thead>
            <tr class="text-center">
                <td colspan="2">
                    <h3>Confira os dados da sua consulta</h3>
                </td>
            </tr>
            </thead>

            <tr>
                <td><b>Data</b></td>
                <td><span th:text="${#temporals.format(start, 'dd/MM/yyyy')}">10/01/2019</span></td>
            </tr>
            <tr>
                <td><b>Horário</b></td>
                <td><span th:text="${#temporals.format(start, 'HH:mm')+' - '+ #temporals.format(end, 'HH:mm')}">14:00 - 15:00</span>
                </td>
            </tr>
            <tr>
                <td><b>Estagiário</b></td>
                <td><span th:text="${provider}">Lucas Pereira</span></td>
            </tr>

            <tr>
                <td><b>Especialidade</b></td>
                <td><span th:text="${work.name}"> Psicologia </span></td>
            </tr>
            <tr>
                <td><b>Descrição</b></td>
                <td><span th:text="${work.description}">descrição</span></td>
            </tr>

            <tr>
                <td><b>Valor</b></td>
                <td><span th:text="${work.price > 0 ? 'R$ ' + #numbers.formatDecimal(work.price, 1, 'POINT', 2, 'COMMA') : 'Gratuito'}"> Gratuito </span></td>
            </tr>

            <tr>
                <td><b>Posso cancelar?</b></td>
                <td><p th:text="${work.editable ? 'Sim' : 'Não, só o estagiário pode cancelar'}">Sim</p></td>
            </tr>
            <tr class="text-center">
                <td colspan="2">
                    <form th:action="@{/appointments/new}" method="POST">
                        <input type="hidden" name="workId" th:value="${work.id}">
                        <input type="hidden" name="providerId" th:value="${providerId}">
                        <input type="hidden" name="start" th:value="${start}">


                        <button type="submit" class="btn btn-primary">Confirmar agendamento</button>
                    </form>

                </td>
            </tr>
        </table>


    </div>

</div>

</body>


</html>
