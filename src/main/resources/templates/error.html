<!DOCTYPE html>
<!-- Página de erro padrão do sistema (o Spring Boot usa o arquivo error.html automaticamente) -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Erro - ClínicaFácil</title>
    <link rel="stylesheet" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"/>
</head>
<body>
<div class="container text-center" style="margin-top: 80px">
    <h1 class="mb-3">ClínicaFácil</h1>
    <th:block th:switch="${status}">
        <p class="lead" th:case="404">Página não encontrada.</p>
        <p class="lead" th:case="403">Você não tem permissão para ver esta página.</p>
        <p class="lead" th:case="*">Ocorreu um erro inesperado. Tente novamente em alguns instantes.</p>
    </th:block>
    <p class="text-muted" th:if="${status != null}">Código do erro: <span th:text="${status}">500</span></p>
    <a class="btn btn-primary mt-3" href="/">Voltar ao início</a>
</div>
</body>
</html>
